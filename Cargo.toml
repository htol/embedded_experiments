[package]
name = "pump_ctrl"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"]}
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
semihosting = "0.1.20"

embassy-executor = { version = "0.9", features = [
  "arch-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-time = { version="0.5", features = ["defmt"] }
embassy-stm32 = { version = "0.4", features = [
    "stm32f103c8",
    "defmt",
    "time-driver-any",
    "unstable-pac",
    "memory-x",
    "exti",
] }
embassy-futures = { version = "0.1.0" }
embassy-sync = { version = "0.6", features = ["defmt"] }

embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0" }
embedded-graphics = "0.8"
ssd1306 = { version = "0.10", features = ["async"]}
heapless = "0.9"
static_cell = "2.0"
libm = "0.2"


[profile.dev]
codegen-units = 1
debug = true
overflow-checks = true
lto = true
opt-level = "z"
panic = 'unwind'
incremental = true
